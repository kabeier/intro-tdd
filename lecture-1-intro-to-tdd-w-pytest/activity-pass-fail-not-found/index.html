<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass, fail, or not found? · Intro to TDD</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f6f9; --grid:#dce3ee; --ink:#1b2230; --muted:#5b6577; --blue:#2552c9; --green:#13795b; --red:#c8372d; --sticky:#ffe76a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: var(--ink); display: grid; grid-template-rows: auto auto 1fr auto;
    background: var(--paper) linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
                linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px; }
  header { padding: 20px 36px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  h1 { font: 800 40px 'Bricolage Grotesque', sans-serif; margin: 0; letter-spacing: -0.02em; }
  .count { font: 700 20px 'JetBrains Mono', monospace; color: var(--muted); }
  .bank { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 36px 0; }
  .bank button { font: 700 22px 'JetBrains Mono', monospace; background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 8px 18px; cursor: pointer; color: var(--ink); }
  .bank button.hit { background: var(--green); border-color: var(--green); color: #fff; }
  .bank button.miss { background: var(--red); border-color: var(--red); color: #fff; }
  .bank .legend { align-self: center; font-size: 16px; color: var(--muted); margin-left: 8px; }
  .stagearea { display: grid; place-items: center; padding: 20px 36px; }
  .card { width: min(1100px, 100%); background: var(--sticky); padding: 48px 56px; transform: rotate(-1deg);
    box-shadow: 0 18px 30px -12px rgb(27 34 48 / 0.35); }
  .who { font: 700 18px 'JetBrains Mono', monospace; margin-bottom: 14px; }
  .q { font: 700 clamp(26px, 3.2vw, 44px)/1.2 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; }
  .q small { display: block; font: 400 clamp(20px, 2vw, 28px)/1.45 'Atkinson Hyperlegible', sans-serif; margin-top: 18px; }
  code { font: 600 .9em 'JetBrains Mono', monospace; }
  .a { margin-top: 30px; background: #fff; border-left: 10px solid var(--green); padding: 18px 24px; font-size: clamp(20px, 2vw, 28px); line-height: 1.4; display: none; }
  .a b { display: block; font: 800 clamp(28px, 3vw, 42px) 'Bricolage Grotesque', sans-serif; color: var(--green); }
  .card.revealed .a { display: block; }
  footer { padding: 0 36px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 500 14px 'JetBrains Mono'; color: var(--muted); }
  footer button { font: 700 16px 'Atkinson Hyperlegible'; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
  footer button.go { background: var(--blue); color: #fff; border-color: var(--blue); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .card { min-width: 0; } @media (max-width: 600px) { .card { padding: 24px 18px; } }
</style>
</head>
<body>
<header>
  <h1>Pass, fail, or not found?</h1>
  <span class="count" id="count"></span>
</header>
<div class="bank" id="bank">
  <!-- One button per possible answer. A card's answer must match a button's text exactly. -->
  <button type="button">PASS</button><button type="button">FAIL</button><button type="button">NOT FOUND</button>
  <span class="legend">NOT FOUND = pytest never runs it (wrong file or function name).</span>
</div>
<div class="stagearea">
  <div class="card" id="card">
    <div class="who">pytest is run in this folder · PASS, FAIL or NOT FOUND in chat on "go"</div>
    <div class="q" id="q"></div>
    <div class="a" id="a"></div>
  </div>
</div>
<footer>
  <button id="prev">← Back</button><button class="go" id="reveal">Reveal (space)</button><button id="next">Next →</button>
  <span>← → to move · space to reveal · first 6 cards are the core set · last card is a bonus</span>
</footer>
<script>
  // [request, answer, why]
  const Q = [
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_math.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_add():\n    assert 2 + 2 == 4</pre>",
        "PASS",
        "Right file name, right function name, and the assert is True."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">mathtests.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_add():\n    assert 2 + 2 == 4</pre>",
        "NOT FOUND",
        "The file name doesn't start with <code>test_</code> (or end in <code>_test.py</code>), so pytest never opens it."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_math.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def check_add():\n    assert 1 + 1 == 2</pre>",
        "NOT FOUND",
        "Functions must start with <code>test</code>. <code>check_add</code> is ignored, even inside a test file."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_math.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_not_equal():\n    assert 3 * 5 != 11</pre>",
        "PASS",
        "15 is not 11, so <code>!=</code> is True."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_math.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_float():\n    assert 0.1 + 0.2 == 0.3</pre>",
        "FAIL",
        "Floating point: <code>0.1 + 0.2</code> is <code>0.30000000000000004</code>. Use <code>math.isclose</code>."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_math.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">import math\n\ndef test_close():\n    assert math.isclose(0.1 + 0.2, 0.3)</pre>",
        "PASS",
        "<code>math.isclose</code> allows a tiny difference, made for decimals."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_fruit.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_grape():\n    assert \"grape\" in [\"apple\", \"banana\"]</pre>",
        "FAIL",
        "\"grape\" isn't in the list, so the assert is False."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_sort.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_sorted():\n    assert sorted([3, 1, 2]) == [1, 2, 3]</pre>",
        "PASS",
        "<code>sorted</code> returns a new, sorted list."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">test_text.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_greeting():\n    assert \"Hello, world!\".startswith(\"hello\")</pre>",
        "FAIL",
        "Capital H: <code>startswith</code> is case-sensitive."
    ],
    [
        "<span style=\"font:600 18px JetBrains Mono,monospace;color:#5b6577\">Bonus: math_test.py</span><pre style=\"font:500 clamp(20px,2.3vw,30px)/1.4 JetBrains Mono,monospace;background:#1b2230;color:#e9edf5;padding:16px 22px;border-radius:8px;white-space:pre;text-align:left;margin:0;overflow-x:auto;max-width:100%;box-sizing:border-box\">def test_add():\n    assert 2 + 2 == 4</pre>",
        "PASS",
        "pytest also collects files that END in <code>_test.py</code>. (Use <code>test_</code> first anyway: it's the class convention.)"
    ]
  ]
  let i = 0
  const $ = (s) => document.querySelector(s)
  const btns = [...document.querySelectorAll('#bank button')]
  function draw() {
    $('#card').classList.remove('revealed')
    $('#q').innerHTML = Q[i][0]
    $('#a').innerHTML = `<b>${Q[i][1]}</b>${Q[i][2]}`
    $('#count').textContent = `${i + 1} / ${Q.length}`
    btns.forEach((s) => s.className = '')
  }
  function reveal(picked) {
    $('#card').classList.add('revealed')
    btns.forEach((s) => s.className = s.textContent === Q[i][1] ? 'hit' : (s.textContent === picked ? 'miss' : ''))
  }
  btns.forEach((b) => b.onclick = () => reveal(b.textContent))
  const go = (n) => { i = Math.min(Math.max(n, 0), Q.length - 1); draw() }
  $('#prev').onclick = () => go(i - 1); $('#next').onclick = () => go(i + 1); $('#reveal').onclick = () => reveal()
  addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); reveal() }
    if (e.key === 'ArrowRight') go(i + 1)
    if (e.key === 'ArrowLeft') go(i - 1)
  })
  draw()
</script>
</body>
</html>
